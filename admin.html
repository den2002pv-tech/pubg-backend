<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Админка карт PUBG</title>
  <style>
    body { font-family: sans-serif; background: #121212; color: #fff; padding: 20px; max-width: 800px; margin: 0 auto; }
    .box { background: #1e1e1e; padding: 15px; border-radius: 8px; margin-bottom: 20px; }
    label { display: block; margin-top: 10px; font-size: 14px; color: #ccc; }
    input, select, button, textarea { width: 100%; padding: 10px; margin-top: 5px; border-radius: 5px; border: none; box-sizing: border-box; }
    button { background: #ff9900; color: #000; font-weight: bold; cursor: pointer; margin-top: 10px; }
    button:disabled { background: #555; color: #888; cursor: not-allowed; }
    .btn-secondary { background: #3498db; color: #fff; }
    .btn-delete { background: #e74c3c; color: #fff; padding: 5px 10px; margin-top: 8px; font-size: 12px; width: auto; }
    textarea { background: #000; color: #0f0; font-family: monospace; height: 150px; resize: vertical; }
    .preview-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 15px; margin-top: 15px; }
    .scan-card-item { background: #2a2a2a; border: 1px solid #444; border-radius: 8px; padding: 12px; text-align: center; }
    .scan-card-item img { max-width: 100%; height: 140px; object-fit: contain; border-radius: 6px; background: #000; }
    .card-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
    .card-item { background: #2a2a2a; padding: 10px; border-radius: 8px; text-align: center; display: flex; flex-direction: column; justify-content: space-between; }
    .rarity-1 { border: 2px solid #888; }
    .rarity-2 { border: 2px solid #3498db; }
    .rarity-3 { border: 2px solid #f1c40f; }
  </style>
</head>
<body>

  <h2>1. Сканирование скриншота</h2>
  <div class="box">
    <label>Загрузите скриншот инвентаря:</label>
    <input type="file" id="screenshotInput" accept="image/*">
    <button id="scanBtn">Загрузить и сканировать скриншот</button>
  </div>

  <div id="resultsContainer" style="display: none;" class="box">
    <h2>2. Найденные карты на скриншоте:</h2>
    <div class="preview-grid" id="scanResults"></div>
  </div>

  <h2>3. Экспорт базы</h2>
  <div class="box">
    <label>Текущий `card_hashes.json`:</label>
    <textarea id="jsonOutput" readonly></textarea>
    <button id="copyJsonBtn">Скопировать JSON в буфер</button>
    <button class="btn-secondary" id="downloadJsonBtn">Скачать card_hashes.json</button>
  </div>

  <h2>4. Карты в текущей базе:</h2>
  <div class="card-list" id="cardList"></div>

  <script>
    const BACKEND_URL = "https://pubg-backend-3rtc.onrender.com";

    async function loadCards() {
      try {
        const res = await fetch(`${BACKEND_URL}/cards`);
        const data = await res.json();
        
        document.getElementById('jsonOutput').value = JSON.stringify(data, null, 2);

        const cardListEl = document.getElementById('cardList');
        cardListEl.innerHTML = '';

        for (const [cardId, cardInfo] of Object.entries(data)) {
          const item = document.createElement('div');
          item.className = `card-item rarity-${cardInfo.rarity || 1}`;
          
          let rarityText = "Серая (1)";
          if (cardInfo.rarity === 2) rarityText = "Синяя (2)";
          if (cardInfo.rarity === 3) rarityText = "Золотая (3)";

          const imgUrl = cardInfo.image ? (cardInfo.image.startsWith('http') ? cardInfo.image : BACKEND_URL + cardInfo.image) : '';

          item.innerHTML = `
            <div>
              ${imgUrl ? `<img src="${imgUrl}" style="width:100%; height:90px; object-fit:contain; background:#000; border-radius:4px; margin-bottom:5px;">` : '<div style="height:90px; background:#111; display:flex; align-items:center; justify-content:center; font-size:10px; color:#555; margin-bottom:5px; border-radius:4px;">Нет фото</div>'}
              <strong>${cardInfo.name || cardId}</strong>
              <small style="color:#aaa; display:block;">ID: ${cardId}</small>
              <small style="display:block;">Редкость: ${rarityText}</small>
            </div>
            <button class="btn-delete" onclick="deleteCard('${cardId}')">Удалить</button>
          `;
          cardListEl.appendChild(item);
        }
      } catch (err) {
        console.error("Ошибка загрузки базы карт:", err);
      }
    }

    document.getElementById('scanBtn').addEventListener('click', async () => {
      const fileInput = document.getElementById('screenshotInput');
      if (!fileInput.files.length) {
        alert('Выберите файл скриншота!');
        return;
      }

      const formData = new FormData();
      formData.append('file', fileInput.files[0]);

      const scanBtn = document.getElementById('scanBtn');
      scanBtn.innerText = 'Сканирование...';
      scanBtn.disabled = true;

      try {
        const response = await fetch(`${BACKEND_URL}/admin/scan-preview`, {
          method: 'POST',
          body: formData
        });
        const result = await response.json();

        const resultsContainer = document.getElementById('resultsContainer');
        const scanResults = document.getElementById('scanResults');
        scanResults.innerHTML = '';
        resultsContainer.style.display = 'block';

        result.cards.forEach((card, index) => {
          const div = document.createElement('div');
          div.className = 'scan-card-item';
          div.innerHTML = `
            <img src="${BACKEND_URL}${card.preview}" alt="card">
            <label>ID карты (англ.):</label>
            <input type="text" id="card_id_${index}" value="card_${index + 1}">
            <label>Название карты:</label>
            <input type="text" id="card_name_${index}" value="Карта ${index + 1}">
            <label>Редкость:</label>
            <select id="card_rarity_${index}">
              <option value="1">1 — Серая</option>
              <option value="2">2 — Синяя</option>
              <option value="3">3 — Золотая</option>
            </select>
            <button onclick="saveCard('${card.hash}', '${card.preview}', ${index})">Сохранить карту в базу</button>
          `;
          scanResults.appendChild(div);
        });
      } catch (err) {
        alert('Ошибка при сканировании.');
        console.error(err);
      } finally {
        scanBtn.innerText = 'Загрузить и сканировать скриншот';
        scanBtn.disabled = false;
      }
    });

    async function saveCard(hash, preview, index) {
      const cardId = document.getElementById(`card_id_${index}`).value.trim();
      const cardName = document.getElementById(`card_name_${index}`).value.trim();
      const cardRarity = parseInt(document.getElementById(`card_rarity_${index}`).value);

      if (!cardId || !cardName) {
        alert('Заполните ID и название карточки!');
        return;
      }

      try {
        const res = await fetch(`${BACKEND_URL}/admin/save-card`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            id: cardId,
            name: cardName,
            hash: hash,
            rarity: cardRarity,
            preview: preview
          })
        });

        if (res.ok) {
          alert(`Карта "${cardName}" успешно сохранена!`);
          loadCards();
        } else {
          alert('Ошибка сохранения');
        }
      } catch (err) {
        alert('Ошибка соединения с сервером.');
        console.error(err);
      }
    }

    async function deleteCard(cardId) {
      if (!confirm(`Точно удалить карту с ID "${cardId}"?`)) return;

      try {
        const res = await fetch(`${BACKEND_URL}/admin/delete-card/${cardId}`, {
          method: 'DELETE'
        });
        if (res.ok) {
          loadCards();
        } else {
          alert('Не удалось удалить карту.');
        }
      } catch (err) {
        console.error(err);
      }
    }

    document.getElementById('copyJsonBtn').addEventListener('click', () => {
      const jsonText = document.getElementById('jsonOutput');
      jsonText.select();
      navigator.clipboard.writeText(jsonText.value);
      alert('JSON скопирован в буфер обмена!');
    });

    document.getElementById('downloadJsonBtn').addEventListener('click', () => {
      const jsonText = document.getElementById('jsonOutput').value;
      const blob = new Blob([jsonText], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'card_hashes.json';
      a.click();
      URL.revokeObjectURL(url);
    });

    loadCards();
  </script>
</body>
</html>
