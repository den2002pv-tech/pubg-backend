<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PUBG Card Admin</title>
<style>
body{font-family:Arial,sans-serif;max-width:1200px;margin:24px auto;padding:0 16px}
.card{border:1px solid #ddd;border-radius:10px;padding:12px;margin:12px 0}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
img{max-width:100%;border-radius:8px}
input,button{padding:9px;margin:4px 0}
pre{white-space:pre-wrap;word-break:break-word;font-size:12px}
</style>
</head>
<body>
<h1>PUBG Card Admin</h1>
<input id="file" type="file" accept="image/*">
<button onclick="scan()">Сканировать</button>
<div id="debug"></div>
<div id="cards" class="grid"></div>
<script>
const API = location.origin;
let scanData = null;

async function scan(){
  const file = document.getElementById('file').files[0];
  if(!file) return alert('Выбери скриншот');
  const fd = new FormData();
  fd.append('file', file);
  const r = await fetch(API + '/admin/scan-preview', {method:'POST',body:fd});
  const data = await r.json();
  if(!r.ok) return alert(JSON.stringify(data));
  scanData = data;

  document.getElementById('debug').innerHTML =
    data.debug_image ? `<h3>Проверка детектора</h3><img src="${data.debug_image}">` : '';

  document.getElementById('cards').innerHTML = data.cards.map((c,i)=>`
    <div class="card">
      <img src="${c.preview}">
      <div>row=${c.row}, col=${c.col}, box=${c.box.join(', ')}</div>
      <input id="id_${i}" placeholder="ID" value="card_${i+1}">
      <input id="name_${i}" placeholder="Название">
      <input id="rarity_${i}" type="number" min="0" max="5" value="0">
      <pre>${JSON.stringify(c.hashes,null,2)}</pre>
      <button onclick="saveCard(${i})">Сохранить</button>
    </div>
  `).join('');
}

async function saveCard(i){
  const c = scanData.cards[i];
  const payload = {
    id: document.getElementById('id_'+i).value.trim(),
    name: document.getElementById('name_'+i).value.trim() || ('Карта '+(i+1)),
    rarity: Number(document.getElementById('rarity_'+i).value || 0),
    preview: c.preview,
    hashes: c.hashes,
    hash: c.hash
  };
  if(!payload.id) return alert('Укажи ID');

  const r = await fetch(API + '/admin/save-card', {
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify(payload)
  });
  const data = await r.json();
  if(!r.ok) return alert(JSON.stringify(data));
  alert('Сохранено: ' + payload.id);
}
</script>
</body>
</html>
