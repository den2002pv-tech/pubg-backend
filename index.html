<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PUBG Card Scanner</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 1100px; margin: 24px auto; padding: 0 16px; }
    .row { display: flex; gap: 10px; flex-wrap: wrap; margin: 12px 0; }
    input, button { padding: 10px; font-size: 14px; }
    button { cursor: pointer; }
    .card { border: 1px solid #ccc; padding: 12px; margin: 12px 0; border-radius: 8px; }
    .matched { border-color: #2e7d32; }
    .unknown { border-color: #c62828; }
    img { max-width: 224px; }
    .muted { color: #666; }
  </style>
</head>
<body>
  <h1>PUBG Card Scanner</h1>

  <div class="row">
    <input id="file" type="file" accept="image/*">
    <button onclick="scan()">Сканировать</button>
  </div>

  <div id="status" class="muted"></div>
  <div id="results"></div>

<script>
const API = location.origin;

async function scan() {
  const input = document.getElementById("file");

  if (!input.files.length) {
    alert("Выбери скриншот");
    return;
  }

  const fd = new FormData();
  fd.append("file", input.files[0]);

  document.getElementById("status").textContent = "Сканирование...";

  const response = await fetch(`${API}/scan`, {
    method: "POST",
    body: fd
  });

  const data = await response.json();

  if (!response.ok) {
    document.getElementById("status").textContent = data.detail || "Ошибка";
    return;
  }

  document.getElementById("status").textContent =
    `Найдено карт: ${data.count}`;

  renderResults(data.cards || []);
}

function renderResults(cards) {
  const root = document.getElementById("results");

  if (!cards.length) {
    root.innerHTML = "<p>Карты не найдены.</p>";
    return;
  }

  root.innerHTML = cards.map((card, index) => {
    const match = card.match || {};
    const ok = match.matched;

    return `
      <div class="card ${ok ? "matched" : "unknown"}">
        <h3>Карта ${index + 1}</h3>
        <p>
          <b>Результат:</b>
          ${ok
            ? `${escapeHtml(match.name || match.id)}`
            : "Неизвестная карта"}
        </p>
        <p>
          <b>Distance:</b> ${match.distance ?? "—"}
        </p>
        <p>
          <b>Позиция:</b> ряд ${card.row + 1}, колонка ${card.col + 1}
        </p>
      </div>
    `;
  }).join("");
}

function escapeHtml(value) {
  return String(value)
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;");
}
</script>
</body>
</html>
