<!DOCTYPE html>
<html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>PUBG Card Exchange</title><script src="https://telegram.org/js/telegram-web-app.js"></script><style>body{font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:#121212;color:#fff;margin:0;padding:16px;text-align:center}.card{background:#1e1e1e;border-radius:12px;padding:20px;margin-top:20px;border:1px solid #333}.btn{background:#0088cc;color:#fff;border:0;padding:12px 24px;border-radius:8px;font-size:16px;font-weight:700;cursor:pointer;width:100%;margin-top:10px}input[type=file]{display:none}.upload-label{display:block;padding:16px;border:2px dashed #0088cc;border-radius:8px;background:rgba(0,136,204,.1);cursor:pointer}.muted{color:#aaa}.match{padding:10px;border-bottom:1px solid #333;text-align:left}</style></head><body><h2>Обмен карт PUBG Mobile</h2><p class="muted">Загрузите скриншот вашей коллекции карт</p><div class="card"><label class="upload-label" for="fileInput"><span id="statusText">📷 Выбрать скриншот</span><input type="file" id="fileInput" accept="image/*"></label></div><div id="results" class="card" style="display:none"><h3>Найденные карты:</h3><div id="cardsList"></div><button class="btn" onclick="requestTrade()">Искать 3-сторонний обмен</button></div><script>const tg=window.Telegram?.WebApp;tg?.expand();const API = 'https://pubg-backend-3rtc.onrender.com';document.getElementById('fileInput').addEventListener('change',uploadImage);async function uploadImage(){const input=document.getElementById('fileInput'),status=document.getElementById('statusText');if(!input.files[0])return;status.textContent='⏳ Сканирование скриншота...';const fd=new FormData();fd.append('file',input.files[0]);try{const r=await fetch(API+'/scan',{method:'POST',body:fd});const d=await r.json();if(!r.ok)throw new Error(d.detail||'Ошибка сервера');status.textContent=`✅ Найдено карточек: ${d.count||0}`;showResults(d.cards||[])}catch(e){status.textContent='❌ Ошибка сканирования: '+e.message}}function showResults(cards){const list=document.getElementById('cardsList');list.innerHTML=cards.map(c=>`<div class="match">${c.name}${c.distance!=null?` <span class="muted">(d=${c.distance})</span>`:''}</div>`).join('');document.getElementById('results').style.display='block'}function requestTrade(){if(tg?.showAlert)tg.showAlert('Запрос на обмен отправлен!');else alert('Запрос на обмен отправлен!')}</script></body></html>
