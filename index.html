<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PUBG Card Scanner</title>
<style>
body{font-family:Arial,sans-serif;max-width:1100px;margin:24px auto;padding:0 16px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.card{border:1px solid #ddd;border-radius:10px;padding:10px}
img{max-width:100%;border-radius:8px}
</style>
</head>
<body>
<h1>PUBG Card Scanner</h1>
<input id="file" type="file" accept="image/*">
<button onclick="scan()">Сканировать</button>
<div id="result" class="grid"></div>
<script>
const API = location.origin;
async function scan(){
  const file = document.getElementById('file').files[0];
  if(!file) return alert('Выбери скриншот');
  const fd = new FormData();
  fd.append('file', file);
  const r = await fetch(API + '/scan',{method:'POST',body:fd});
  const data = await r.json();
  if(!r.ok) return alert(JSON.stringify(data));
  document.getElementById('result').innerHTML = (data.matches || []).map(m=>`
    <div class="card">
      ${m.preview ? `<img src="${m.preview}">` : ''}
      <div>row=${m.row}, col=${m.col}</div>
      <b>${m.card_id || 'Не найдено'}</b>
      <div>score: ${m.score ?? '-'}</div>
    </div>
  `).join('');
}
</script>
</body>
</html>
