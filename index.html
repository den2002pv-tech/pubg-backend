<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PUBG Card Exchange</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #121212;
      color: #ffffff;
      margin: 0;
      padding: 16px;
      text-align: center;
    }
    .card {
      background: #1e1e1e;
      border-radius: 12px;
      padding: 20px;
      margin-top: 20px;
      border: 1px solid #333;
    }
    .btn {
      background: #0088cc;
      color: #fff;
      border: none;
      padding: 12px 24px;
      border-radius: 8px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      width: 100%;
      margin-top: 10px;
    }
    input[type="file"] { display: none; }
    .upload-label {
      display: block;
      padding: 16px;
      border: 2px dashed #0088cc;
      border-radius: 8px;
      background: rgba(0, 136, 204, 0.1);
      cursor: pointer;
    }
  </style>
</head>
<body>
  <h2>Обмен карт PUBG Mobile</h2>
  <p style="color: #aaa; font-size: 14px;">Загрузите скриншот вашей коллекции карт</p>

  <div class="card">
    <label class="upload-label" for="fileInput">
      <span id="statusText">📷 Выбрать скриншот</span>
      <input type="file" id="fileInput" accept="image/*" onchange="uploadImage()">
    </label>
  </div>

  <div id="results" class="card" style="display: none;">
    <h3>Найденные карты:</h3>
    <div id="cardsList" style="text-align: left; color: #ccc;"></div>
    <button class="btn" onclick="requestTrade()">Искать 3-сторонний обмен</button>
  </div>

  <script>
    const tg = window.Telegram.WebApp;
    tg.expand();

    async function uploadImage() {
      const input = document.getElementById('fileInput');
      const status = document.getElementById('statusText');
      if (!input.files[0]) return;

      status.innerText = "⏳ Сканирование скриншота...";

      const formData = new FormData();
      formData.append('file', input.files[0]);

      try {
        // Запрос к бэкенду (URL укажем после деплоя Python-сервера)
        const res = await fetch('https://pubg-backend-3rtc.onrender.com/scan', {
          method: 'POST',
          body: formData
        });
        const data = await res.json();
        
        status.innerText = "✅ Скриншот успешно обработан!";
        showResults(data.cards);
      } catch (err) {
        status.innerText = "❌ Ошибка сканирования (сервер не ответил)";
      }
    }

    function showResults(cards) {
      const list = document.getElementById('cardsList');
      list.innerHTML = cards.map(c => `• ${c}`).join('<br>');
      document.getElementById('results').style.display = 'block';
    }

    function requestTrade() {
      tg.showAlert("Запрос на обмен отправлен! Как только зациклится 3-сторонний обмен, бот пришлет код.");
    }
  </script>
</body>
</html>
