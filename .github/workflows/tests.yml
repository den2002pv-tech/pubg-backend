name: Backend tests

on:
  push:
    branches:
      - main
      - feature/card-counter
  pull_request:
    branches:
      - main
      - feature/card-counter
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements-dev.txt

      - name: Compile Python files
        run: python -m compileall -q main.py database.py scanner.py tests

      - name: Run automated tests
        env:
          ADMIN_PASSWORD: ci-test-password-not-a-secret
          ADMIN_SESSION_SECRET: ci-test-session-secret
        run: python -m pytest -q
