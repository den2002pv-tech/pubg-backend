name: Android APK

on:
  push:
    branches:
      - feature/android-card-boundary-annotator
    paths:
      - "android-card-annotator/**"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-card-annotator
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build debug APK
        run: gradle --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: pubg-card-annotator-debug-apk
          path: android-card-annotator/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
